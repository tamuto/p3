<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>card</title>
<style>
  html,body{margin:0;height:100%}
  body{background:linear-gradient(135deg,#4c1d95,#4f46e5 55%,#2563eb);color:#fff;font-family:"Noto Sans CJK JP",sans-serif;display:flex;align-items:center;justify-content:center}
  .box{max-width:1000px;padding:0 60px}
  .logo{display:inline-flex;align-items:center;justify-content:center;width:72px;height:72px;border-radius:16px;background:rgba(255,255,255,.15);font:italic 700 40px serif;margin-bottom:28px}
  h1{font-size:46px;margin:0 0 18px;line-height:1.35}
  p{font-size:24px;line-height:1.7;margin:0 0 10px;opacity:.92}
  .note{margin-top:34px;font-size:18px;opacity:.75}
  code{font:22px "Noto Sans Mono CJK JP",monospace;background:rgba(0,0,0,.25);padding:6px 12px;border-radius:8px}
</style></head>
<body><div class="box" id="box"></div>
<script>
window.card = (html) => { document.getElementById("box").innerHTML = html; };
</script></body></html>
