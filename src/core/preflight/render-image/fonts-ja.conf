<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  画面イメージの描画で、日本語を Noto CJK JP で描く（Dockerfile が /etc/fonts/conf.d/ に置く）。
  Playwright の依存で入る WenQuanYi Zen Hei（中国語の字形）が総称の既定に先に来るので、総称と、イメージに無い日本語の
  フォント名を Noto CJK JP に寄せる。原稿が明示したほかのフォント（Noto Sans CJK SC など）と埋め込みのフォントには触れない。
-->
<fontconfig>
  <!-- 総称 -->
  <alias binding="strong"><family>sans-serif</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="strong"><family>system-ui</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="strong"><family>serif</family><prefer><family>Noto Serif CJK JP</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>Noto Sans Mono CJK JP</family></prefer></alias>

  <!-- イメージに無い日本語のゴシック体 -->
  <alias binding="strong"><family>Noto Sans JP</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="strong"><family>Hiragino Sans</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="strong"><family>Hiragino Kaku Gothic ProN</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="strong"><family>ヒラギノ角ゴ ProN</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="strong"><family>Yu Gothic</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="strong"><family>游ゴシック</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>

  <!-- イメージに無い日本語の明朝体 -->
  <alias binding="strong"><family>Noto Serif JP</family><prefer><family>Noto Serif CJK JP</family></prefer></alias>
  <alias binding="strong"><family>Hiragino Mincho ProN</family><prefer><family>Noto Serif CJK JP</family></prefer></alias>
  <alias binding="strong"><family>Yu Mincho</family><prefer><family>Noto Serif CJK JP</family></prefer></alias>
  <alias binding="strong"><family>游明朝</family><prefer><family>Noto Serif CJK JP</family></prefer></alias>
</fontconfig>
